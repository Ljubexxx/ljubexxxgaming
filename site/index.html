<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050506" />
  <meta name="description" content="LjubeXXX Gaming — official streaming hub, schedule, games and social links." />
  <title>LjubeXXX Gaming</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-noise" aria-hidden="true"></div>
  <div class="ambient ambient-left" aria-hidden="true"></div>
  <div class="ambient ambient-right" aria-hidden="true"></div>

  <header class="site-header" id="home">
    <a class="brand" href="#home" aria-label="LjubeXXX Gaming home">
      <img src="assets/brand.webp" alt="LjubeXXX Gaming" />
    </a>

    <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
      <b>MENU</b>
    </button>

    <nav class="main-nav" id="mainNav" aria-label="Main navigation">
      <a class="active" href="#home">HOME</a>
      <a href="#about">ABOUT ME</a>
      <a href="#schedule">SCHEDULE</a>
      <a href="#games">GAMES</a>
      <a href="#currently">SETUP</a>
      <a href="#socials">CONTACT</a>
    </nav>
  </header>

  <main class="page-shell">
    <aside class="social-column social-left" id="socialsLeft" aria-label="Streaming and social links"></aside>

    <section class="content-column">
      <section class="hero-shell" id="games" aria-label="Featured games">
        <button class="hero-arrow hero-arrow-left" id="prevGame" type="button" aria-label="Previous featured game">‹</button>

        <div class="game-stage">
          <div class="game-grid" id="gameGrid"></div>
          <div class="core-badge" aria-label="LjubeXXX Gaming">
            <div class="core-ring"></div>
            <div class="core-inner">
              <span class="core-mark">L</span>
              <strong>LJUBEXXX</strong>
              <em>GAMING</em>
            </div>
          </div>
        </div>

        <button class="hero-arrow hero-arrow-right" id="nextGame" type="button" aria-label="Next featured game">›</button>
      </section>

      <section class="live-bar" id="liveBar" aria-live="polite">
        <div class="live-state"><i></i><strong id="liveLabel">LIVE NOW</strong></div>
        <span class="live-divider"></span>
        <b id="liveTagline">COME JOIN THE STREAM!</b>
      </section>

      <section class="info-grid">
        <article class="info-card about-card" id="about">
          <div class="panel-title"><span class="title-icon person-icon"></span><h2>ABOUT ME</h2></div>
          <div class="about-content">
            <div class="hoodie-art" aria-hidden="true"><span>LX</span></div>
            <p id="aboutText"></p>
          </div>
        </article>

        <article class="info-card schedule-card" id="schedule">
          <div class="panel-title"><span class="title-icon calendar-icon"></span><h2>STREAM SCHEDULE</h2></div>
          <div class="schedule-list" id="scheduleList"></div>
          <small>TIMES ARE (CET / BELGRADE)</small>
        </article>

        <article class="info-card playing-card" id="currently">
          <div class="panel-title"><span class="title-icon controller-icon"></span><h2>CURRENTLY PLAYING</h2></div>
          <div class="playing-content">
            <div class="controller-art" aria-hidden="true"><span>+</span><i></i><i></i></div>
            <div><strong id="currentGame"></strong><span class="red-stroke"></span><p id="genres"></p></div>
          </div>
        </article>
      </section>
    </section>

    <aside class="social-column social-right" id="socialsRight" aria-label="Community and social links"></aside>
  </main>

  <footer class="site-footer">
    <span></span><p>© <b id="year"></b> LJUBEXXX GAMING. ALL RIGHTS RESERVED.</p><span></span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
