<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050507" />
  <meta name="description" content="LjubeXXX Gaming — streaming hub, schedule, games, and social links." />
  <title>LjubeXXX Gaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="site-bg"></div>

  <header class="site-header" id="home">
    <div class="brand-wrap panel panel-soft">
      <p class="eyebrow">STREAM • GAME • COMMUNITY</p>
      <h1 class="brand-title">LJUBEXXX</h1>
      <div class="brand-subtitle">GAMING</div>
    </div>

    <nav class="main-nav panel panel-soft" aria-label="Main navigation">
      <a href="#home" class="active">HOME</a>
      <a href="#setup">SETUP</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="layout-grid">
      <aside class="social-column left" id="leftSocials" aria-label="Left social links"></aside>

      <section class="center-column">
        <section class="games-shell panel" id="games">
          <button class="carousel-arrow left" id="desktopPrev" type="button" aria-label="Show previous game">‹</button>
          <div class="games-grid" id="desktopGames"></div>
          <button class="carousel-arrow right" id="desktopNext" type="button" aria-label="Show next game">›</button>

          <div class="core-badge" aria-hidden="true">
            <div class="core-orbit orbit-a"></div>
            <div class="core-orbit orbit-b"></div>
            <div class="core-ring"></div>
            <div class="core-inner">
              <div class="core-brand core-brand-large">LJUBEXXX<br><span>GAMING</span></div>
            </div>
          </div>
        </section>

        <section class="live-bar panel panel-soft" aria-label="Live banner">
          <span class="live-dot">●</span>
          <strong>LIVE NOW</strong>
          <span class="divider"></span>
          <span id="liveTagline">COME JOIN THE STREAM!</span>
        </section>

        <section class="content-grid">
          <article class="info-card panel" id="about">
            <header><span class="card-kicker">ABOUT ME</span></header>
            <div class="about-body">
              <div class="about-badge brand-font">Lj</div>
              <p id="aboutText"></p>
            </div>
          </article>

          <article class="info-card panel" id="schedule">
            <header><span class="card-kicker">STREAM SCHEDULE</span></header>
            <div class="schedule-list" id="scheduleList"></div>
            <p class="meta-line">TIMES ARE (CET / BELGRADE)</p>
          </article>

          <article class="info-card panel" id="setup">
            <header><span class="card-kicker">SETUP</span></header>
            <div class="playing-body">
              <div class="playing-icon">PC</div>
              <div>
                <strong class="playing-title" id="playingTitle"></strong>
                <p id="playingGenres"></p>
              </div>
            </div>
          </article>
        </section>
      </section>

      <aside class="social-column right" id="rightSocials" aria-label="Right social links"></aside>
    </div>
  </main>

  <footer class="site-footer panel panel-soft">
    <span>© <span id="year"></span> LJUBEXXX GAMING. ALL RIGHTS RESERVED.</span>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
